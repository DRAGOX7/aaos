[project]
name = "aaos"
version = "0.1.0"
description = "Local-first, policy-governed academic workflow assistant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.19.1",
    "chromadb==1.5.9",
    "fastapi>=0.141.1",
    "FlagEmbedding==1.4.2",
    "google-api-python-client==2.200.0",
    "google-auth==2.58.0",
    "httpx2>=2.10.0",
    "playwright==1.62.0",
    "pyjwt[crypto]==2.15.1",
    "pypdfium2==5.13.0",
    "python-docx==1.2.0",
    "sentencepiece==0.2.2",
    "sqlalchemy>=2,<3",
    "torch==2.13.0+cu130",
    "transformers==5.16.1",
    "tzdata==2026.3",
    "urllib3==2.7.0",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
aaos = "aaos.cli:main"
aaos-moodle-callback = "aaos.moodle.receiver:main"

[dependency-groups]
dev = [
    "langchain-community==0.3.27",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ragas==0.4.3",
    "ruff>=0.16.2",
    "trustme>=1.2.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
